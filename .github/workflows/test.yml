name: Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      minio:
        image: minio/minio
        ports:
          - 9000:9000
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        # MinIO はデフォルトで "server /data" を実行する
        # health check は MinIO が完全に起動するまで待つ必要がないため、簡易チェックのみ

      vault:
        image: hashicorp/vault:latest
        ports:
          - 8200:8200
        env:
          VAULT_DEV_ROOT_TOKEN_ID: root
          VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
        options: >-
          --health-cmd "vault status || exit 0"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Install dependencies
        run: go mod download

      - name: Run tests (without S3 and Vault)
        run: go test -v -short ./...

      - name: Setup MinIO bucket
        run: |
          # MinIO CLI をインストール
          wget -q https://dl.min.io/client/mc/release/linux-amd64/mc
          chmod +x mc
          sudo mv mc /usr/local/bin/

          # MinIO に接続
          mc alias set local http://localhost:9000 minioadmin minioadmin

          # テスト用バケットを作成
          mc mb local/kvtool-test || true

      - name: Run full tests (with S3 and Vault)
        run: go test -v ./...
        env:
          VAULT_ADDR: http://localhost:8200
          VAULT_TOKEN: root
