name: Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      minio:
        image: minio/minio
        ports:
          - 9000:9000
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        # MinIO はデフォルトで "server /data" を実行する
        # health check は MinIO が完全に起動するまで待つ必要がないため、簡易チェックのみ

      vault:
        image: hashicorp/vault:latest
        ports:
          - 8200:8200
        env:
          VAULT_DEV_ROOT_TOKEN_ID: root
          VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
        options: >-
          --health-cmd "vault status || exit 0"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Install dependencies
        run: go mod download

      - name: Wait for MinIO
        run: |
          # MinIO が起動するまで待つ（最大30秒）
          for i in {1..30}; do
            if curl -sf http://localhost:9000/minio/health/live > /dev/null 2>&1; then
              echo "MinIO is ready"
              break
            fi
            echo "Waiting for MinIO... ($i/30)"
            sleep 1
          done

      - name: Setup MinIO bucket
        run: |
          # MinIO CLI をインストール
          wget -q https://dl.min.io/client/mc/release/linux-amd64/mc
          chmod +x mc
          sudo mv mc /usr/local/bin/

          # MinIO に接続（リトライ付き）
          for i in {1..5}; do
            if mc alias set local http://localhost:9000 minioadmin minioadmin; then
              echo "Connected to MinIO"
              break
            fi
            echo "Retrying MinIO connection... ($i/5)"
            sleep 2
          done

          # テスト用バケットを作成
          mc mb local/kvtool-test || true

      - name: Run all tests
        run: go test -v ./...
        env:
          VAULT_ADDR: http://localhost:8200
          VAULT_TOKEN: root

  deploy-docs:
    # テストが成功した場合のみドキュメントをデプロイ
    needs: test
    # main ブランチへの push 時のみ実行
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup mdBook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: 'latest'

      - name: Build book
        run: mdbook build docs

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs/book

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
