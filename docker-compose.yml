services:
  vault:
    image: hashicorp/vault:latest
    container_name: vault-dev
    ports:
      - "8200:8200"
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_UI: "true"
      VAULT_DEV_ROOT_TOKEN_ID: "root"
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    command:
      - vault
      - server
      - -dev
    healthcheck:
      test: ["CMD", "sh", "-c", "VAULT_ADDR=http://127.0.0.1:8200 vault status"]
      interval: 2s
      timeout: 3s
      retries: 10

  # 初期化: KV v2 を secret/ に有効化して、テストデータを書き込む
  vault-init:
    image: hashicorp/vault:latest
    depends_on:
      vault:
        condition: service_healthy
    environment:
      VAULT_ADDR: "http://vault:8200"
      VAULT_TOKEN: "root"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        echo "[vault-init] initializing..."
        vault secrets enable -path=secret kv-v2 >/dev/null 2>&1 || true
        vault kv put secret/app/prod username=alice password=pa55w0rd >/dev/null
        echo "[vault-init] done."
    restart: "no"

  # MinIO (S3 互換ストレージ)
  minio:
    image: minio/minio:latest
    container_name: minio-dev
    ports:
      - "9000:9000"  # API
      - "9001:9001"  # Web UI
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # MinIO 初期化: テスト用バケットとデータを作成
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        echo "[minio-init] configuring MinIO client..."
        mc alias set minio http://minio:9000 minioadmin minioadmin

        echo "[minio-init] creating test bucket..."
        mc mb minio/kvtool-test --ignore-existing

        echo "[minio-init] uploading test data..."
        echo '{"app_name":"kvtool","version":"1.0.0"}' | mc pipe minio/kvtool-test/config/app.json
        echo 'APP_NAME=kvtool
        APP_ENV=production
        DATABASE_URL=postgres://localhost/mydb' | mc pipe minio/kvtool-test/config/production.env

        echo "[minio-init] done."
    restart: "no"

  # NATS (JetStream KV Store)
  nats:
    image: nats:latest
    container_name: nats-dev
    ports:
      - "4222:4222"   # Client
      - "8222:8222"   # Monitoring
    command: ["-js", "-m", "8222"]
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -q --spider http://localhost:8222/healthz || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 10

  # NATS 初期化: テスト用 KV バケットとデータを作成
  nats-init:
    image: natsio/nats-box:latest
    depends_on:
      nats:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        echo "[nats-init] creating test KV bucket and data..."
        nats -s nats://nats:4222 kv add kvtool-test 2>/dev/null || true
        nats -s nats://nats:4222 kv put kvtool-test "app/settings" '{"debug":true,"port":8080}'
        nats -s nats://nats:4222 kv put kvtool-test simple 'hello world'
        echo "[nats-init] done."
    restart: "no"

volumes:
  minio-data:
