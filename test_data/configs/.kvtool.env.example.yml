version: 0.1

namespaces:
  default:
    # Environment variables filesystem
    # Reads all environment variables as a JSON object
    "env":
      driver: "env"
      args: {}
      mount:
        file: ""

    # Local filesystem with .env file transform
    ".env":
      driver: "local"
      args:
        transform:
          read: dotenv
          write: dotenv
        root: "."
      mount:
        file: ""

# Usage examples:
#
# Get all environment variables:
#   kvtool store get env/any -c test_data/configs/.kvtool.env.example.yml
#
# Get environment variables as raw key=value format:
#   kvtool store get env/any -c test_data/configs/.kvtool.env.example.yml -o raw
#
# Note: For env driver, the file path (e.g., "any") is ignored
# All environment variables are always returned